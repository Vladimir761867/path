name: Build mobile app (Android APK + iOS check)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'РЯДОМ/01_Прототип/dist/**'
      - 'РЯДОМ/03_Приложение/**'
      - '.github/workflows/app.yml'

permissions:
  contents: write

concurrency:
  group: app-build
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: РЯДОМ/03_Приложение
    env:
      RYADOM_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Android SDK уже установлен в образе ubuntu-latest (ANDROID_HOME); недостающие платформы Gradle докачает сам.
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build web bundle
        run: npm run web
        env:
          RYADOM_API_URL: ${{ vars.RYADOM_API_URL }}
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Debug APK (для установки и проверки)
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Prepare signing key (если задан секрет ANDROID_KEYSTORE_BASE64)
        id: sign
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "on=1" >> "$GITHUB_OUTPUT"; else echo "on=0" >> "$GITHUB_OUTPUT"; fi
      - name: Signed release APK + AAB (для RuStore / Google Play)
        if: steps.sign.outputs.on == '1'
        env:
          RYADOM_KEYSTORE: ${{ runner.temp }}/release.jks
          RYADOM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RYADOM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RYADOM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Collect files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/ryadom-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then cp android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/ryadom-release.apk"; fi
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then cp android/app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/out/ryadom-release.aab"; fi
          ls -la "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v4
        with:
          name: ryadom-android-${{ github.run_number }}
          path: out/*
      - name: Publish «android-latest» release (прямая ссылка для телефона)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest out/* --title "Рядом для Android — сборка ${{ github.run_number }}" \
            --notes "Тестовая сборка из ветки main ($(git rev-parse --short HEAD)). Установка: скачай ryadom-debug.apk на телефон Android, открой файл и разреши установку из этого источника. Это проверочная версия, не из магазина." \
            --prerelease

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: РЯДОМ/03_Приложение
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build web bundle and sync
        run: npm run web && npx cap sync ios
      - name: Compile for iOS Simulator (без подписи — проверка, что проект собирается)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
